<div class="bg-gradient-to-br from-blue-50 to-purple-50 rounded-xl p-6">
  <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center">
    <i class="fas fa-pen text-primary mr-2"></i>
    Add a comment
  </h3>
  
  <form action="{% url 'cms_blog:post_comment' post.id %}" method="post" class="space-y-4">
    {{ form.as_p }}
    {% csrf_token %}
    
    <div class="pt-2">
      <button type="submit" class="w-full bg-primary text-white px-6 py-3 rounded-lg font-medium transition-all duration-300 hover:bg-primary-dark hover:scale-105 hover:shadow-lg">
        <i class="fas fa-paper-plane mr-2"></i>
        Post Comment
      </button>
    </div>
  </form>
</div>

<style>
  .bg-gradient-to-br p {
    margin-bottom: 1rem;
  }
  
  .bg-gradient-to-br label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: #374151;
  }
  
  .bg-gradient-to-br input:not([type="submit"]),
  .bg-gradient-to-br textarea {
    width: 100%;
    padding: 0.75rem;
    border: 2px solid #e5e7eb;
    border-radius: 0.5rem;
    font-size: 0.95rem;
    transition: all 0.3s;
    background: white;
  }
  
  .bg-gradient-to-br input:focus,
  .bg-gradient-to-br textarea:focus {
    outline: none;
    border-color: #4361ee;
    box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
  }
  
  .bg-gradient-to-br textarea {
    min-height: 120px;
    resize: vertical;
  }
</style>
