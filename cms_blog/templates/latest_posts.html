{% for post in latest_posts %}
<a
  href="{{ post.get_absolute_url }}"
  class="block p-3 rounded-lg transition-all duration-300 hover:bg-blue-50 hover:translate-x-1 group"
>
  <div class="flex items-start space-x-2">
    <i
      class="fas fa-newspaper text-primary mt-1 group-hover:scale-110 transition-transform duration-300"
    ></i>
    <div class="flex-1">
      <h5
        class="text-sm font-medium text-gray-900 group-hover:text-primary transition-colors duration-300"
      >
        {{post.title}}
      </h5>
      <span class="text-xs text-gray-500"
        >{{ post.publish|date:"M d, Y" }}</span
      >
    </div>
  </div>
</a>
{% endfor %}
